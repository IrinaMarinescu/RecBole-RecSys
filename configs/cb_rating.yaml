load_col:
  inter: [user_id, item_id, rating]
  item: [item_id, movie_title, class]
content: [movie_title, class]
normalize_all: False         # keep ratings on the 1-5 scale (pos_rating_threshold, weighted_avg and score_mapping rely on it)
max_seq_length: 64
score_mapping: True
eval_args:
  split: {RS: [0.8, 0.1, 0.1]}
  order: RO
  group_by: ~
  mode: labeled
threshold: ~
LABEL_FIELD: rating          # with no threshold RecBole creates no `label` column, so evaluate against the raw rating
metrics: [RMSE, MAE]
valid_metric: RMSE
