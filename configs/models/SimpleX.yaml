# SimpleX: user = mix of its own embedding and the mean of its recent items (gamma);
# trained with the cosine contrastive loss (CCL): positives pulled to cosine 1, and each of many
# sampled negatives pushed below `margin`, weighted by negative_weight.
model: SimpleX
embedding_size: 64
margin: 0.5
negative_weight: 10
gamma: 0.5
aggregator: mean
history_len: 50
reg_weight: 1e-05
dropout_prob: 0.1
learning_rate: 0.001
epochs: 300
stopping_step: 10               # early stopping on valid NDCG@10
train_neg_sample_args:          # SimpleX is designed for many negatives per positive
  distribution: uniform
  sample_num: 50
