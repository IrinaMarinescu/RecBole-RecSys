# LightGCN: user/item embeddings smoothed over the user-item graph by n_layers of neighbour
# averaging (no feature transforms or non-linearities); the final embedding is the mean over layers.
# score(u, i) = <e_u, e_i>, trained with the BPR pairwise loss against one sampled negative.
model: LightGCN
embedding_size: 64
n_layers: 2
reg_weight: 1e-05
learning_rate: 0.001
epochs: 300
stopping_step: 10               # early stopping on valid NDCG@10
train_neg_sample_args:
  distribution: uniform
  sample_num: 1
